name = "gallery-media-guard"
main = "worker.js"
compatibility_date = "2024-01-01"

account_id = "280af5a1ec6294e6b4f265d84717a98f"
workers_dev = true

routes = [
  { pattern = "albums.studio-galleries.com/*", zone_name = "studio-galleries.com" },
  { pattern = "private.studio-galleries.com/media/*", zone_name = "studio-galleries.com" }
]

[[r2_buckets]]
binding = "GALLERY_BUCKET"
bucket_name = "albums"

# Set separately as Worker secrets (never committed):
#   wrangler secret put R2_EDGE_SIGNING_SECRET
#   wrangler secret put GALLERY_SESSION_SECRET
# GALLERY_SESSION_SECRET must be the EXACT same value as the Next.js app's
# GALLERY_SESSION_SECRET env var (production) — the Worker verifies the same
# session-cookie token the app signs.
